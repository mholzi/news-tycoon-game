name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Two browsers now. The desktop project is Chromium; the mobile project is
      # iPhone 13, which Playwright drives with WebKit. Installing Chromium alone
      # made every mobile test fail with "Executable doesn't exist" while the
      # same suite passed locally, because a dev machine already has WebKit.
      #
      # WebKit and not a Chromium phone profile on purpose: the mobile suite
      # exists to hold a claim about being played on a phone, and `position:
      # sticky` — which the pinned account and print bar both depend on — is
      # where iOS Safari has the longest history of behaving differently.
      # Swapping to Chromium would make CI green by testing the easier browser.
      - name: Install the browsers Playwright needs
        run: npx playwright install --with-deps chromium webkit

      - name: Build
        run: npm run build

      - name: Unit and integration tests
        run: npm run test:unit

      # The build has to exist before the e2e run, which is why this follows
      # the build step rather than sitting beside it.
      - name: End-to-end tests
        run: npx playwright test --grep-invert @network

      # Watches for the site changing the shape the game depends on. Allowed to
      # fail the step and not the build: Vercel being down is not a regression
      # in this repository, and a red PR that nobody caused teaches people to
      # ignore red PRs.
      - name: Live feed contract (advisory)
        continue-on-error: true
        run: npx playwright test --grep @network
